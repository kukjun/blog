name: Deploy Astro to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # 수동 실행 버튼

permissions:
  contents: read
  pages: write
  id-token: write

# 동시 배포 1개로 제한 (진행중인 것은 끝내되 큐는 최신만)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install, build, upload
        uses: withastro/action@v3
        # path: .        # 저장소 루트에 package.json이 있으므로 기본값 사용
        # node-version: 20  # 필요시 지정

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
